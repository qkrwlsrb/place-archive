spring:
  datasource:
    url: jdbc:h2:mem:place_archive_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-for-place-archive-backend-portfolio-123456
  access-token-expiration-minutes: 30
