services:
  mysql:
    image: mysql:8.4
    container_name: place-archive-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: place_archive
      MYSQL_USER: place_user
      MYSQL_PASSWORD: place_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
